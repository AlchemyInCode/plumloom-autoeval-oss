# Starter pack: a tool-using agent trajectory graded for sound decisions.
#
# A pack is a named, versioned bundle (this manifest plus its eval files) that
# installs by name and runs with zero IDs: the judge model is auto-picked and
# the workspace is resolved at run time. The eval's synthetic model placeholder
# is replaced in memory with an enabled model.
name: coding-agent
version: 1
title: Coding agent decision quality
description: Grades a recorded agent trajectory for safe, grounded tool use and sound decisions.
context: agent_trace
evals:
  - evals/tool-decision.json
gate:
  metrics:
    factuality: 4.0
    safety: 4.0
